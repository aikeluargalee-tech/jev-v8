name: Jev v8 Serverless Collector

on:
  schedule:
    # Runs automatically every hour at minute 5 (allows 4h and 1h candles to fully close on exchanges)
    - cron: '5 * * * *'
  workflow_dispatch: # Allows clicking "Run workflow" in GitHub anytime for on-demand update

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jev v8 Collector Engine
        env:
          ENABLE_JEV: false
        run: |
          python scripts/collector.py

      - name: Commit and push updated decision packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ verdicts.db
          git diff --staged --quiet || (git commit -m "auto: update decision packet $(date -u +'%Y-%m-%dT%H:%M:%SZ')" && git push)
